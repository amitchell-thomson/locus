# Locus configuration template. Copy to config.toml and adjust paths.
# NO SECRETS HERE. The Claude API key comes from the ANTHROPIC_API_KEY env var.

[ollama]
host          = "http://localhost:11434"
embed_model   = "nomic-embed-text"
ingest_model  = "qwen2.5:7b-instruct-q5_K_M"  # settled by the §11.C benchmark (2026-06-05): beats llama3.1:8b-q5_K_M 3.96 vs 3.65 overall
num_ctx       = 8192              # ingest context window; >Ollama default 4096 so prop-dense sections don't slide out mid-generation

[paths]
db            = "vault/locus.db"
raw_store     = "vault/raw"
incoming      = "vault/incoming"
notes         = "vault/notes"

[embed]
dim           = 768               # locked to nomic-embed-text; changing => full re-embed
chunk_tokens  = 512

[retrieve]
proposition_top_k    = 10         # highest-signal claims, searched as first-class units
fine_top_k           = 20         # L3 chunks
section_top_k        = 5          # L2 section summaries
figure_top_k         = 8          # figure caption+description vectors (step 11)
rerank_top_k         = 8          # survivors after cross-encoder rerank
per_doc_cap          = 3          # max units per document among survivors (diversity; relaxed if underfull)
context_token_budget = 100000     # cap on assembled context to the Claude API call
# min_rerank_score   = 0.22       # confidence floor on cross-encoder logits (~-11..+11). Unset =
                                  # disabled. When set: rerank refill never pads the top-k with
                                  # below-floor candidates, and a best-survivor below the floor flags
                                  # the result LOW CONFIDENCE (signal, not filter). Calibrate with
                                  # scripts/calibrate_rerank_threshold.py (0.22 = the 2026-06-05
                                  # calibration on the 24-doc corpus); recalibrate after bulk ingest.
# Docs (exact source_uri) dropped from the candidate pool in production retrieval — e.g. the
# self-ingested locus repo, whose own code/tests/README would otherwise compete with real
# queries. `locus retrieve --include-excluded` overrides. Default: none.
# exclude_source_uris = ["/abs/path/to/locus"]
# Multi-query cross-domain expansion (H2): when a query is bridge-shaped ("X relate to Y")
# or the first pass is low-confidence, rephrase it into N other disciplinary vocabularies
# (local qwen) and rerank each candidate against the variant that found it — so a doc written
# in another field's terms clears the floor instead of being demoted. 0 = single-pass only.
multi_query_expansion = true
multi_query_k        = 2          # reformulations beyond the original
# Down-weight for maturity=rough capture notes (agent-layer §6.1): subtracted from the
# cross-encoder score of rough-doc candidates before the final sort (a logit penalty, NOT a
# multiplier — pre-rerank arm scores don't order results, and a multiplier on signed logits is
# incoherent). Flag/down-weight, never filter. Inert until rough notes exist; eval-tune then. 0 = off.
# EVAL-TUNED 2026-07-29: 1.5 -> 0.0 (OFF). Swept 14 queries x 4 values against the 12 real
# rough notes Loop A captured (scripts/analysis/rough_penalty_sweep.py): recovery 2/6 at 1.5,
# 0.75 and 0.35, but 3/6 at 0.0 — while non-note queries stayed 8/8 correct at EVERY value, so
# the penalty never actually prevented an intrusion. It only cost recall: at 1.5 the EM-rates
# note was unreachable. `rough` measures POLISH; retrieval must rank on VALUE, and a jotted idea
# is often the higher-value unit — it is the owner's own thinking and exists nowhere else.
# Knob kept (not deleted) so the demotion is one edit away if capture volume ever crowds results.
rough_penalty        = 0.0

[mathocr]
# Math-aware page OCR: pages whose text layer is damaged or math-dense are re-read by an
# OCR-to-markup engine; recovered markdown+LaTeX replaces the page text (QC-guarded).
# Engine picked by benchmark on flagged corpus pages (eval-artifacts/mathocr/report.md):
# GOT-OCR2.0 won on risk asymmetry — 0 hallucinations / 0 engine failures (fidelity 0.93,
# prose 4.9/5) vs qwen-VL 0.97 with one invented equation and Nougat with 4/10 failures.
engine        = "got"             # "got" (transformers, mathocr extra) | "qwen" (Ollama VLM) | "off"
model         = "qwen2.5vl:7b"    # Ollama model used by the "qwen" engine

[figures]
# Figure extraction + VLM description (step 11, §15.1). Tier 1: detect raster images and
# vector diagrams in PDFs (and visual-bearing slides), render to PNG in the raw store with
# any paired caption. Tier 2: a local VLM describes each figure; caption+description is
# embedded and searched as a first-class unit (figure_vectors). Tier 3: at generation, the
# top figure survivors attach as actual images to the (multimodal) Claude call.
# Thresholds lean STRICT — a missed figure is benign; a junk figure burns a VLM call and a
# retrieval slot.
enabled          = true
model            = "qwen2.5vl:7b" # Ollama VLM (already pulled for the mathocr "qwen" engine)
engine           = "ollama"       # "ollama" (default; CPU vision encode, ~25 s/figure) or
                                  # "llamacpp" (GPU vision encode via an on-demand llama-server,
                                  # ~3-5 s/figure; needs the llama.cpp binary — optional system
                                  # dep; absent/failing it falls closed to "ollama")
# llamacpp_binary = "/home/<user>/.local/opt/llama-bXXXX/llama-server"  # abs path => bundled libs found
# llamacpp_model  = "ggml-org/Qwen2.5-VL-7B-Instruct-GGUF:Q4_K_M"       # -hf spec or local .gguf
# llamacpp_port   = 8090
render_slides    = true           # full-slide render via LibreOffice (`soffice` must be on PATH;
                                  # absent => slides skip figures with a warning, never quarantine)
min_area_frac    = 0.03           # area band, as fraction of page area: below = icons/decoration
max_area_frac    = 0.92           #   above = full-page background
min_vector_paths = 8              # strokes needed for a vector cluster to count as a diagram
max_text_density = 2.0            # max text-layer chars/1000pt² in a region (diagrams <=1.6
                                  # corpus-measured; prose-with-drawings and tables >=2.2)
caption_max_gap_pt = 60.0         # max vertical gap (pt) figure <-> caption block
max_per_page     = 4              # junk guard
image_cap        = 3              # max figure images attached per Claude call / MCP reply

[generation]
# RAG generation model (§1: answer quality is the priority). Use a 4.6+ model (adaptive
# thinking). claude-sonnet-4-6 is a cheaper, very capable alternative for high query volume.
model         = "claude-opus-4-8"

[mcp]
# The MCP `query` tool generates server-side -> billed Claude API calls. `retrieve` and the read
# tools are local-only (free). Keep false so the server never advertises a billable tool unless
# you opt in (or pass `locus mcp --enable-query`).
enable_query  = false
include_figure_images = true      # attach retrieved figure images as MCP image content blocks

[repos]
# Tracked code repositories (step 10). `locus watch` checks each repo's git HEAD every
# check_interval seconds and re-ingests only when new commits landed (the check is ~free);
# `locus sync [--force]` runs the same pass manually. Smaller/ad-hoc repos can instead be
# dropped as a folder into LocusDrop/projects/<name>/ — ingested once as a snapshot.
paths = [
  "/home/alec/server-projects/digest",
  "/home/alec/server-projects/locus",
  "/home/alec/server-projects/quant-data",
  "/home/alec/server-projects/regime-conditioned-equity-ml",
  "/home/alec/server-projects/tanker-flow",
]
check_interval = 3600   # seconds between HEAD checks inside `locus watch`
# Repo-relative globs excluded from ingest. The locus repo indexes itself, and these
# files carry the labelled eval queries verbatim — answer keys that outrank real
# content on their own questions (round-5 audit).
exclude_globs = [
  "locus/eval/retrieval_eval.py",
  "tests/test_retrieve.py",
  "tests/test_link_aliases.py",
  "tests/test_pass_hygiene.py",
]

[alias]
# Cross-document entity-alias resolution (`locus link`, step 12). Deterministic tiers run
# first; remaining lookalike clusters are adjudicated by the Claude API (billed — only on
# new/changed clusters, verdicts are cached). Thresholds lean conservative: a missed merge
# is fragmentation, a wrong merge corrupts the link substrate.
block_threshold   = 0.86   # cosine floor (nomic name embeddings) for candidate edges
min_token_overlap = 0.34   # token-Jaccard guard on candidate edges
max_cluster_size  = 8      # clusters larger than this skip the LLM (cost guard)
min_merge_len     = 4      # names shorter than this never merge (homonym risk: 'var', 'P2')
use_llm           = true   # false = deterministic tiers only (no API)
api_call_interval = 1.5    # seconds between adjudication API calls (rate-limit politeness; 0 = off)
# Related-documents stop-entity guard: drop entities appearing in >this fraction of the
# corpus from related-doc ranking (ubiquitous terms say nothing about a pairing). Resolved
# to ratio x doc count at query time; auto-off below a small-corpus floor. 0 disables.
stop_doc_freq_ratio = 0.4

[retitle]
# Corpus-level document retitling (`locus retitle`). Composes distinctive
# '[Module — ][Seq: ]Topic' titles and breaks same-title collisions across the corpus.
# The topic is distilled from the stored synthesis by the Claude API (billed — cached by
# content hash, so re-runs only call for new docs). Manual-only, like [alias]; run after
# the pour. `--no-llm` falls back to a deterministic thesis-clause topic (rewrites only
# docs with a module/sequence signal). `--dry-run` previews; `--rollback` restores.
use_llm           = true   # false = deterministic thesis-clause topics only (no API)
api_call_interval = 1.5    # seconds between topic-distillation API calls (0 = off)

[obsidian]
# Read-only Obsidian projection (`locus export-obsidian`, §13). A one-way, regenerable
# render of the corpus as a browsable vault — never read back, never in the retrieval path,
# joins-only (no API). Run AFTER `locus link` (entity notes need the alias substrate). The
# exporter owns only its docs/ and entities/ subtrees and never touches .obsidian/. View it
# from the Mac by rsync-pulling the tree (see docs/obsidian-projection-plan.md §10).
out_dir          = "vault/obsidian"   # exporter-owned root (gitignored, regenerable)
top_related      = 10                 # doc<->doc related edges per note (matches related_documents)
min_cluster_docs = 2                  # emit a canonical entity note only if it spans >= this many docs
emit_entity_notes = true              # false = docs-only graph (no canonical entity notes)

[concepts]
# Code concept-entity pass (`ingest/concepts.py`, §1.2 Link). Extracts the DOMAIN
# concepts a repository implements/studies from its narrative (synthesis + README + file
# summaries, never raw code) into concept/method/tool/dataset/metric/theorem entities, so
# code projects link to the papers they are built on. A doc-level local-qwen pass run for
# source_type=code; `locus link` then folds the concepts into the alias substrate. Backfill
# existing repos with `uv run python -m scripts.backfill_code_concepts`.
enabled     = true   # run the concept pass at ingest for code repos
max_per_doc = 40     # cap concepts written per repo (a runaway README is the failure mode)
# stoplist  = []     # override the built-in generic-term stoplist (empty = built-in default)

[reading]
# Server->device reading delivery (`locus read <path|dir>`, agent-layer §8.5, Phase 0.5).
# Renders markdown -> a device-tuned PDF (pandoc md->typst -> typst compile; needs the
# `[reading]` extra) and `rmapi put`s it to the tablet. Geometry defaults target the reMarkable
# Paper Pro screen (2160x1620 @229dpi => 7.07x9.43in) so text renders at its true point size.
rmapi_binary   = "rmapi"   # rmapi binary (PATH name or absolute path)
target_folder  = "Locus"   # device folder that delivered docs land in
page_width_in  = 7.07      # PDF page width (in) — Paper Pro screen width
page_height_in = 9.43      # PDF page height (in) — Paper Pro screen height
margin_in      = 0.5       # page margin (in)
font_pt        = 11.0      # body text size (pt)

[discovery]
# Proposed reading and the accept loop (docs/reading-discovery-plan.md, Phase 4).
# `Locus/Reading/{Proposed,In-Progress,Finished}` on the device: moving a file OUT of Proposed is
# the accept signal and triggers ingest; leaving it there is a rejection. Free and local — the
# accept loop calls no model and no network.
root_folder  = "Locus/Reading"  # device folder holding the three reading folders
rmapi_binary = "rmapi"          # rmapi binary (PATH name or absolute path)
# Caps are on the STOCK sitting in Proposed, not on a rate: a full folder proposes nothing, so
# falling behind produces silence rather than a backlog. Empty is a valid state.
paper_cap    = 3                # max papers held in Proposed at once
book_cap     = 1                # max books — one considered suggestion, not a feed
ttl_days     = 21               # days in Proposed before it reads as a no (a WEAK negative)
drop_folder  = "paper"          # folder under vault/incoming/ that accepted readings ingest via
# The discovery engine (step 2). WHAT LEAVES THE MACHINE: a category token, an offset and a page
# size — nothing else. Searching arXiv for his topics would ship his research vocabulary to a
# third party on a timer, so relevance is judged LOCALLY instead: harvest a broad slice by
# subject, embed the abstracts on his own GPU, rank against his own projects.
arxiv_categories = ["q-fin.PM", "q-fin.ST", "q-fin.TR", "q-fin.RM", "q-fin.CP",
                    "econ.EM", "stat.ML", "stat.AP", "eess.SY", "cs.RO"]
# A quota PER CATEGORY, not a shared pool. q-fin is outpublished ~10x by stat.ML/cs.LG, so a
# single OR-query returned just 2 q-fin.PM papers out of 200 (measured 2026-07-31).
per_category       = 25
harvest_limit      = 400        # overall cap across all categories
# THE term that makes this discovery rather than more-of-the-same: a candidate's similarity to
# material he ALREADY has is subtracted, so the engine rewards work that is close to a project
# but unlike anything in the corpus. Sweep it against his judgement before trusting the value.
familiarity_weight = 0.25  # SWEPT 2026-07-31: 1.0 buried the best papers
gap_weight         = 0.6        # a gap match counts less than a project match

[agent]
# Agent-layer orchestration (agent-layer plan §10, Phase 1). Capture/enrichment loops run
# language tasks through headless `claude -p` (subscription), metered by a cost ledger over the
# claude -p envelope's total_cost_usd. Bulk work uses API Batch instead (added with hybrid routing).
model              = "haiku"   # claude -p model for durable agent passes (Phase-0 routing choice)
daily_cost_cap_usd = 5.0       # soft daily claude -p spend cap (USD); omit/None for no cap

[ingest]
# Per-pass ingest LLM routing (agent-layer §7). 'local' = local qwen (Ollama, default); a Claude
# alias ('haiku'/'sonnet') or model id routes that pass to the METERED Anthropic SDK (cheap Haiku;
# the right channel for high-volume small passes). Embeddings + math-OCR are ALWAYS local. Empty =
# every pass local. Uncomment to move the durable passes to Haiku (metered; needs ANTHROPIC_API_KEY):
# pass_routing = { summarize = "haiku", propositions = "haiku", entities = "haiku", synthesis = "haiku", gaps = "haiku", concepts = "haiku" }

[capture]
# Loop A — reMarkable handwriting capture (agent-layer §8.1). The device pushes each changed
# notebook to staging_dir as <uuid>.pdf; capture maps it to its name+folder via rmapi (find+stat)
# and files it as a rough note. folder_category overrides the built-in map (empty = built-in).
staging_dir      = "/path/to/remarkable-import"    # where the device-push receiver lands renders
rmapi_binary     = "rmapi"                          # PATH name or absolute path
transcribe_model = "claude-sonnet-5"                # VISION model (metered SDK). Sonnet default: A/B on
                                                    # real dense handwriting beat Haiku decisively; seeds corpus
transcribe_dpi   = 150                              # page render DPI for transcription
excluded_folders = ["trash", "Locus", "admin", "reading_list"]     # not Loop-A handwriting capture. reading_list holds BOOKS being read: the staged PDF is
                                                   # the device render with the published page and the owner's ink flattened
                                                   # together, so vision transcription cannot tell his margin note from the
                                                   # author's sentence — and note-category docs are read as HIS words by
                                                   # belief-position extraction. Waits for Loop B (§8.2), which separates
                                                   # highlight/margin/underline from source text.
default_category = "note"                           # category for folders not in the map
# folder_category = { rough_notes = "note", projects = "project", careers = "career" }

[structure]
# Object/belief proposal (agent-layer §6.2-6.3, Phase 2). Every value here is a PRECISION knob:
# an agent proposing six plausible objects per note trains the owner to ignore it (failure mode
# #7), and one stance he never took corrupts the belief trajectory. Loosen on --dry-run evidence.
max_objects_per_doc      = 3          # hard cap; the model ranks, the cap truncates the tail
min_concept_docs         = 2          # a proposable concept must already span >= N documents
max_support_links        = 3          # extra cross-doc links, only from floor-clearing citations
# A Concept object is an IDEA. A language, a platform, a person, a company, a ticker are not —
# however central they are to the work. The first live run proposed `Python` and `Optibook`
# (both entity type `tool`) as concepts to track; filtering by KIND is the right instrument.
concept_exclude_entity_types = ["tool", "author", "organization", "ticker", "other"]
belief_source_categories = ["note"]   # ONLY owner-authored docs may yield positions; a paper's
                                      #   claim is the paper's, not his (§3.4)
# model = "haiku"                     # override [agent].model for this pass
