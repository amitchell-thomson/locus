# keryx config — copy to ~/.config/keryx/config.toml (SPEC §10).
# Secrets never go here: they live in the macOS Keychain (docs/setup.md).

# false = writes only touch messages whose subject starts with [keryx-test],
# and sends only go to your own addresses. Set true once Phase 4/6 checks pass.
live = false
timezone = "Europe/London"

