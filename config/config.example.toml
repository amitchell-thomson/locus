# Keys: shared filing destinations ("Admin is Admin on any account").
# folders maps account id → Gmail label or Mail mailbox. Numbered 1… in the TUI.
[[keys]]
name = "Admin"
colour = "lavender"
kairos_key = "Personal"
folders = { personal = "Admin & Receipts", oxford = "Admin" }

[[keys]]
name = "Engineering"
colour = "blue"
kairos_key = "Engineering"
folders = { oxford = "Engineering" }

[[keys]]
name = "Careers"
colour = "peach"
kairos_key = "Careers"
folders = { personal = "Careers", oxford = "Careers" }

[[keys]]
name = "Travel"
colour = "sapphire"
kairos_key = "Personal"
folders = { personal = "Travel" }

[[keys]]
