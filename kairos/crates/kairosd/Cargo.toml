[package]
name = "kairosd"
description = "kairos server daemon: single writer to iCloud, HTTP API, MCP, scheduler, notifications"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "kairosd"
path = "src/main.rs"

[dependencies]
kairos-core.workspace = true
locus-contract.workspace = true
kairos-store.workspace = true
anyhow.workspace = true
axum = "0.8"
chrono.workspace = true
chrono-tz.workspace = true
clap.workspace = true
hex.workspace = true
hmac.workspace = true
reqwest = { workspace = true }
rmcp = { version = "3.5", features = ["server", "macros", "transport-streamable-http-server", "schemars"] }
schemars = "1"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["compression-gzip"] }
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
