[project]
name = "locus"
version = "0.1.0"
description = "Self-hosted, AI-queryable personal knowledge vault (CLI, query-driven RAG)."
authors = [{ name = "Alec Mitchell-Thomson" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "rmscene>=0.8.0",   # .rm v6 stroke geometry for Loop B (annotation linking)
    "pydantic>=2.6",
    "sqlite-vec>=0.1.6",
    "alembic>=1.13",
    "pymupdf>=1.24",
    "ollama>=0.3",
    "anthropic>=0.40",
    "tiktoken>=0.7",
    "mcp>=1.27.2",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    # Image handling for the figures pipeline (step 11): downscale guard at generation/MCP.
    # (python-pptx already pulls pillow transitively; declared direct because we import PIL.)
    "pillow>=10.0",
]

[project.optional-dependencies]
# Heavy: pulls torch. Installed only when the reranker (Stage 6) is built.
rerank = ["sentence-transformers>=3.0"]
# Math-OCR pass (plan step 6): GOT-OCR2.0 via transformers — chosen by benchmark
# (eval-artifacts/mathocr/report.md: 0 hallucinations / 0 engine failures, vs qwen-VL's
# 0.97-with-an-invention and Nougat's 4/10 failures). torch itself comes via `rerank`.
mathocr = ["transformers>=4.48", "torchvision"]
# Reading delivery (`locus read`, agent-layer §8.5): markdown -> device-tuned PDF -> reMarkable.
# Both bundle their own binaries (no system pandoc/typst/LaTeX needed): pypandoc-binary ships
# the pandoc executable (md->typst, LaTeX-math-aware), typst ships the compiler (typst->PDF).
reading = ["typst>=0.15", "pypandoc-binary>=1.15"]

[project.scripts]
locus = "locus.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["locus"]
