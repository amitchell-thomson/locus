# The registry: one entry for each thing you work on (ADR-006). The one copy, read by locus
# (the fixtures and, later, the HTTP service) and by kairos (kairosd serves it at /api/taxonomy;
# the Mac keeps a cached copy for offline). Areas and streams must be the ones in areas.toml.
#
# Names are stable: Slice 0's tablet capture matches folder names to `name` (courses) and to
# `company` (applications), so a rename is a decision, not a tidy-up. `active = false` is
# registered but not shown on Home.

# ── repo ────────────────────────────────────────────────────────────────────────────────────────
# Repositories you work in: the Project window shows and follows these.

[[projects]]
id = "quast"
name = "quast"
area = "Projects"
kind = "repo"
active = true
depth = "field"
sessions = ["quast"]

[[projects]]
id = "nabla"
name = "nabla"
area = "Projects"
kind = "repo"
active = true
depth = "design"
sessions = ["nabla"]

[[projects]]
id = "locus"
name = "locus"
area = "Projects"
kind = "repo"
active = true
depth = "design"
sessions = ["locus-dev", "kairos", "keryx"]
components = [{ name = "locus", repo = "locus" }, { name = "kairos (calendar)", repo = "kairos" }, { name = "keryx (mail)", repo = "keryx" }]

[[projects]]
id = "oqts"
name = "OQTS"
area = "Projects"
kind = "repo"
active = true
depth = "outcome"
sessions = ["oqts"]
components = [{ name = "oxdaq", repo = "oqts/oxdaq-core" }, { name = "platform", repo = "oqts/oqts-platform" }, { name = "website", repo = "oqts/oqts-site" }]

[[projects]]
id = "cv"
name = "CV"
area = "Careers"
kind = "repo"
active = true
sessions = ["cv"]

[[projects]]
id = "3yp"
name = "3YP"
area = "Studies"
kind = "repo"
course = "b3"
active = true
sessions = ["B3-Project"]

[[projects]]
id = "tanker-flow"
name = "Tanker-flow"
area = "Projects"
kind = "repo"
active = false

