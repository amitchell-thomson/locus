# Alembic configuration for Locus.
# The DB URL is normally injected programmatically (locus.db.migrate) or resolved from
# config.toml by env.py, so it is intentionally left blank here.

[alembic]
script_location = locus/db/migrations
prepend_sys_path = .
path_separator = os
# sqlalchemy.url is resolved at runtime (env.py falls back to config.toml's paths.db).
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
