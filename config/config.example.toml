folders = { oxford = "JCR Treasurer" }

[risk]
batch_threshold = 100      # Claude's automated-only batches above this need you

[send]
hold_seconds = 10          # undo window after you confirm / approve a send
max_attachments_mb = 25

[snooze]
enabled = false            # off for now: wake-ups only run on the Mac (bare dates below still use `morning`)
later_today_hours = 3
morning = "08:00"          # "Tomorrow" / "Monday" presets

[gmail]
poll_seconds = 60

[automated]                # overrides for newsletter/notification detection
always = []                # e.g. "news@example.com", "@mailer.example.com"
never = []                 # e.g. "@ox.ac.uk"

[cleanup]
new_days = 3               # "new" = arrived in the last 3 days
soon_days = 7              # "needed soon" = within 7 days; later → snooze
notes = ""                 # your habits, for Claude ("keep JCR Treasurer mail")

[runs]
enabled = true
morning = "08:00"
evening = "18:00"
max_threads = 200
timeout_minutes = 15
claude_bin = "claude"

[kairos]
url = "http://compute-node:7420"
token_service = "kairos-api-token"

[notify]
ntfy_server = "https://ntfy.sh"
approvals = false            # true: push each Claude draft with approve / reject links

[server]
bind = "127.0.0.1"         # set to the Mac's Tailscale IP for phone links
port = 7421
