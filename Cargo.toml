# The locus Rust workspace: the locus window and the crates shared with kairos and keryx.
# Those two depend on crates here by git, pinned to a commit (`rev = "…"`); bump it deliberately.
# eco-dates and locus-theme came from the `locus-shared` repo (formerly `eco`) on 19 Oct 2026
# (ADR-004).
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[workspace.dependencies]
eco-dates = { path = "crates/eco-dates" }
locus-contract = { path = "crates/locus-contract" }
locus-theme = { path = "crates/locus-theme" }
anyhow = "1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6", features = ["derive"] }
crossterm = "0.29"
ratatui = "0.30"
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
unicode-width = "0.2"
insta = "1.49"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
