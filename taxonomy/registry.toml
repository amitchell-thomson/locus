# The registry: one entry for each thing you work on (ADR-006). The one copy, read by locus
# (the fixtures and, later, the HTTP service) and by kairos (kairosd serves it at /api/taxonomy;
# the Mac keeps a cached copy for offline). Areas and streams must be the ones in areas.toml.
#
# `folder` is the thing's folder, the same name on the laptop (~/files/<area>/<folder>) and on the
# tablet (/<area>/<folder>): lowercase words joined by hyphens, no spaces (files-and-chat F1).
# Capture matches tablet folders on it, so a rename is a decision, not a tidy-up. A company's
# applications share its folder; so do a repo and the course it does the work of (3YP and B3).
# `active = false` is registered but not shown on Home.

# ── repo ────────────────────────────────────────────────────────────────────────────────────────
# Repositories you work in: the Project window shows and follows these.

[[projects]]
id = "quast"
name = "quast"
folder = "quast"
area = "Projects"
kind = "repo"
state = "live"
active = true
depth = "field"
sessions = ["quast"]

[[projects]]
id = "nabla"
name = "nabla"
folder = "nabla"
area = "Projects"
