# Locus configuration template. Copy to config.toml and adjust paths.
# NO SECRETS HERE. The Claude API key comes from the ANTHROPIC_API_KEY env var.

[ollama]
host          = "http://localhost:11434"
embed_model   = "nomic-embed-text"
ingest_model  = "qwen2.5:7b-instruct-q5_K_M"  # settled by the §11.C benchmark (2026-06-05): beats llama3.1:8b-q5_K_M 3.96 vs 3.65 overall
num_ctx       = 8192              # ingest context window; >Ollama default 4096 so prop-dense sections don't slide out mid-generation

[paths]
db            = "data/locus.db"
raw_store     = "data/raw"
incoming      = "data/incoming"
notes         = "data/notes"

[embed]
dim           = 768               # locked to nomic-embed-text; changing => full re-embed
chunk_tokens  = 512

[retrieve]
proposition_top_k    = 10         # highest-signal claims, searched as first-class units
fine_top_k           = 20         # L3 chunks
section_top_k        = 5          # L2 section summaries
figure_top_k         = 8          # figure caption+description vectors (step 11)
# min_rerank_score   = 0.22       # floor on cross-encoder logits (~-11..+11) for the capture
                                  # Related block (enrich/related.py): a library unit below it is
                                  # not linked. Unset = every scored unit counts.

[mathocr]
# Math-aware page OCR: pages whose text layer is damaged or math-dense are re-read by an
# OCR-to-markup engine; recovered markdown+LaTeX replaces the page text (QC-guarded).
# Engine picked by benchmark on flagged corpus pages (eval-artifacts/mathocr/report.md):
# GOT-OCR2.0 won on risk asymmetry — 0 hallucinations / 0 engine failures (fidelity 0.93,
# prose 4.9/5) vs qwen-VL 0.97 with one invented equation and Nougat with 4/10 failures.
engine        = "got"             # "got" (transformers, mathocr extra) | "qwen" (Ollama VLM) | "off"
model         = "qwen2.5vl:7b"    # Ollama model used by the "qwen" engine

[figures]
# Figure extraction + VLM description (step 11, §15.1). Tier 1: detect raster images and
# vector diagrams in PDFs (and visual-bearing slides), render to PNG in the raw store with
# any paired caption. Tier 2: a local VLM describes each figure; caption+description is
# embedded and searched as a first-class unit (figure_vectors). Tier 3: at generation, the
# top figure survivors attach as actual images to the (multimodal) Claude call.
# Thresholds lean STRICT — a missed figure is benign; a junk figure burns a VLM call and a
# retrieval slot.
enabled          = true
model            = "qwen2.5vl:7b" # Ollama VLM (already pulled for the mathocr "qwen" engine)
engine           = "ollama"       # "ollama" (default; CPU vision encode, ~25 s/figure) or
                                  # "llamacpp" (GPU vision encode via an on-demand llama-server,
                                  # ~3-5 s/figure; needs the llama.cpp binary — optional system
                                  # dep; absent/failing it falls closed to "ollama")
# llamacpp_binary = "/home/<user>/.local/opt/llama-bXXXX/llama-server"  # abs path => bundled libs found
# llamacpp_model  = "ggml-org/Qwen2.5-VL-7B-Instruct-GGUF:Q4_K_M"       # -hf spec or local .gguf
# llamacpp_port   = 8090
render_slides    = true           # full-slide render via LibreOffice (`soffice` must be on PATH;
                                  # absent => slides skip figures with a warning, never quarantine)
min_area_frac    = 0.03           # area band, as fraction of page area: below = icons/decoration
max_area_frac    = 0.92           #   above = full-page background
min_vector_paths = 8              # strokes needed for a vector cluster to count as a diagram
max_text_density = 2.0            # max text-layer chars/1000pt² in a region (diagrams <=1.6
                                  # corpus-measured; prose-with-drawings and tables >=2.2)
caption_max_gap_pt = 60.0         # max vertical gap (pt) figure <-> caption block
max_per_page     = 4              # junk guard

[mcp]
# Accepted and ignored since H1 (10 Nov): the billable `query` tool is retired.
enable_query  = false

[repos]
# Tracked code repositories (step 10). `locus watch` checks each repo's git HEAD every
# check_interval seconds and re-ingests only when new commits landed (the check is ~free);
# `locus sync [--force]` runs the same pass manually. Smaller/ad-hoc repos can instead be
# dropped as a folder into data/incoming/projects/<name>/ — ingested once as a snapshot.
paths = [
  "/home/alec/server-projects/digest",
  "/home/alec/server-projects/locus",
  "/home/alec/server-projects/quant-data",
  "/home/alec/server-projects/regime-conditioned-equity-ml",
  "/home/alec/server-projects/tanker-flow",
]
check_interval = 3600   # seconds between HEAD checks inside `locus watch`
# Repo-relative globs excluded from ingest. The locus repo indexes itself, and these
# files carry the labelled eval queries verbatim — answer keys that outrank real
# content on their own questions (round-5 audit).
exclude_globs = [
  "locus/eval/retrieval_eval.py",
  "tests/test_retrieve.py",
  "tests/test_link_aliases.py",
  "tests/test_pass_hygiene.py",
]

[concepts]
# Code concept-entity pass (`ingest/concepts.py`, §1.2 Link). Extracts the DOMAIN
# concepts a repository implements/studies from its narrative (synthesis + README + file
# summaries, never raw code) into concept/method/tool/dataset/metric/theorem entities, so
# code projects link to the papers they are built on. A doc-level local-qwen pass run for
# source_type=code; `locus link` then folds the concepts into the alias substrate. Backfill
# existing repos with `uv run python -m scripts.backfill_code_concepts`.
enabled     = true   # run the concept pass at ingest for code repos
max_per_doc = 40     # cap concepts written per repo (a runaway README is the failure mode)
# stoplist  = []     # override the built-in generic-term stoplist (empty = built-in default)

[reading]
# Server->device reading delivery (`locus read <path|dir>`, agent-layer §8.5, Phase 0.5).
# Renders markdown -> a device-tuned PDF (pandoc md->typst -> typst compile; needs the
# `[reading]` extra) and `rmapi put`s it to the tablet. Geometry defaults target the reMarkable
# Paper Pro screen (2160x1620 @229dpi => 7.07x9.43in) so text renders at its true point size.
rmapi_binary   = "rmapi"   # rmapi binary (PATH name or absolute path)
target_folder  = "Daily"   # device folder that delivered docs land in. `Daily`, not `Locus`,
                           # since the 2026-08 reorganisation: folders are named for the ACTIVITY
                           # they hold, and /Daily doubles as the unread inbox (a page stays loose
                           # there until it has ink on it, then archives to Daily/YYYY-MM).
send_folder    = "Inbox"   # device folder for ad-hoc markdown sends (the MCP `to_remarkable`
                           # tool). Its own folder, because every other candidate is load-bearing:
                           # not target_folder (/Daily is the ink inbox, so a loose doc there
                           # reads as an unread daily page); not Reading/{In-Progress,Finished}
                           # (loop_b reads those as "he chose this" and auto-ingests them).
                           # He files a read document into its area folder himself; capture
                           # knows it is Claude's from its recorded hash (Slice 0.12).
page_width_in  = 7.07      # PDF page width (in) — Paper Pro screen width
page_height_in = 9.43      # PDF page height (in) — Paper Pro screen height
margin_in      = 0.5       # page margin (in) for the markdown path; LaTeX uses latex_margin_in
font_pt        = 11.0      # body text size (pt) for the MARKDOWN path (his own relayed text),
                           # and through the shared geometry the daily page. NOT the LaTeX size.
latex_font_pt  = 10.0      # body text size (pt) for AGENT-AUTHORED LaTeX sends, set one column
                           # inside even margins (the redesign plan documents' geometry).
                           # Separate from font_pt on purpose: resizing what Claude writes must
                           # not resize his own notes or the daily page.
                           # Must be one of 8/9/10/11/12/14/17/20 — the sizes the `extsizes`
                           # document class implements. Anything else is refused AT LOAD rather
                           # than silently rounded: stock `article` takes only 10/11/12 and
                           # typesets [9.5pt] at 10pt, announcing it only as "Unused global
                           # option" in a log nobody reads.
latex_margin_in = 0.95     # page margin (in), all four sides, for agent-authored LaTeX sends
latex_engine   = "tectonic"  # engine for AGENT-AUTHORED sends. A document Claude writes for the
                           # tablet is authored in LaTeX (locus/reading/tex2pdf), not markdown —
                           # equations, layout and figure placement that markdown cannot express.
                           # Unlike the markdown path (pandoc+typst, both pip-installed from the
                           # lockfile) this needs a binary on PATH; "tectonic" is preferred because
                           # it fetches the packages a document asks for rather than needing a
                           # provisioned TeX distribution. "pdflatex" also works. An engine named
                           # here but not installed is NOT fatal — the code falls through to
                           # whichever is present and only errors when none is.
latex_timeout_s = 900    # ceiling on ONE engine invocation, in seconds. Sized for the one-off
                           # COLD-CACHE package fetch, not the compile: tectonic downloads the
                           # pgf/tikz tree on first use, and tikz+pgfplots load for every document,
                           # so a one-line fragment pays the same fetch as a diagram-heavy brief.
                           # MEASURED 2026-09-08 — warm 1.2s, but two COLD runs took 201.5s and
                           # 149.7s, straddling the old hardcoded 180s (and the SLOWER one was the
                           # one-line fragment, so the document is not the variable — the network
                           # is). Hence the intermittent "server is down" and the fact that a full
                           # brief and a minimal fragment failed identically. Treat this as a
                           # ceiling on a runaway document, never a budget for a normal one.

[agent]
# Where model calls run (agent/claude.py): the Max API credit first, the subscription when it
# refuses. Every call is counted (`locus budget`).
model              = "haiku"   # model for durable agent passes (Phase-0 routing choice)
backend            = "api"     # model calls on the Max API credit first; the subscription (headless
                               # claude -p) only when the credit refuses. "subscription" = API off.
api_retry_hours    = 24        # after a refusal, hours on the subscription before trying the API again
credit_cycle_day   = 1         # day of the month the Max API credit renews (for `locus budget`)
# api_models = { haiku = "claude-haiku-4-5-20251001", sonnet = "claude-sonnet-5", opus = "claude-opus-5-5" }
# api_prices = { "claude-haiku-4-5-20251001" = [1.0, 5.0] }   # USD/Mtok in,out: ESTIMATES for locus budget
daily_cost_cap_usd = 5.0       # soft daily claude -p spend cap (USD); omit/None for no cap

[ingest]
# Per-pass ingest LLM routing (agent-layer §7). 'local' = local qwen (Ollama, default); a Claude
# alias ('haiku'/'sonnet') or model id runs that pass on the SUBSCRIPTION through a lean headless
# `claude -p` (Slice 0.13; no API key). Embeddings + math-OCR are ALWAYS local. Empty = every pass
# local. Uncomment to move the durable passes to Haiku:
# pass_routing = { summarize = "haiku", propositions = "haiku", entities = "haiku", synthesis = "haiku", gaps = "haiku", concepts = "haiku" }

[capture]
# Capture from the reMarkable cloud (Slice 0.12, capture/device.py). One `rmapi ls /` per run
# refreshes rmapi's own tree cache, which is read for every document's folder, kind and hashes.
# What a document is decides how it is read: a NOTEBOOK is his writing (Loop A: rendered,
# transcribed, filed as a rough note under its area's category); a PDF Locus SENT is Claude's
# (never ingested; his notes on it promoted with the passage each was about); any other PDF in
# Studies/, Projects/ or Careers/ is a SOURCE (queued into incoming/<area>/ for locus-watch).
# Only those folders, Inbox, Reading and notebooks at the root (Jot) are read; there is no folder
# map or exclusion list. Level 2 of an area folder is matched to taxonomy/registry.toml.
staging_dir      = "/path/to/remarkable-import"    # where notebook renders are written for transcription
rmapi_binary     = "rmapi"                          # PATH name or absolute path
rmapi_tree_cache = "~/.cache/rmapi/tree.cache"      # rmapi's tree cache, read after the one listing call
max_notebooks_per_run = 4                           # notebooks rendered + transcribed per run (billed vision)
annotate_max_fetch = 15                             # PDF bundles downloaded per run; the rest wait (cloud 429s)
transcribe_model = "claude-sonnet-5"                # VISION model (subscription, image inline). Sonnet: A/B on
                                                    # real dense handwriting beat Haiku decisively; seeds corpus
transcribe_dpi   = 150                              # page render DPI for transcription
# Loop B on the same timer: the ink on PDFs captured and its handwriting transcribed
# automatically (capture/loop_b.py). Transcription was the ONE manual link in the ink->answer
# chain; marks map to library documents by content hash of the bundle's PDF bytes.
annotate_transcribe    = true                       # transcribe new annotation ink (billed vision)
annotate_max_transcribe = 8                         # per-run cap; the rest wait a tick (skips already-read ink)

[structure]
# Which documents are HIS writing (agent/state.owner_authored_sql; heuris search reads it to tell
# his notes from sources): anything under the notes directory; else one of these categories AND
# one of these formats (`project` also holds vendor PDFs). Nothing dropped into an area folder of
# the drop zone counts, whatever its category (ADR-003).
belief_source_categories = ["note", "project", "career"]
belief_source_types      = ["markdown", "text", "docx", "notebook"]
